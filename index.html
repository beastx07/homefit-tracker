
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101610">
<title>HomeFit</title>
<style>
body{margin:0;background:#101610;color:#fff;font:16px Arial}
header{padding:22px;background:#1d2c20}h1{color:#b8f36b}
main{padding:12px;max-width:650px;margin:auto}
nav{display:flex;gap:6px;overflow:auto}
button{padding:11px;border:0;border-radius:9px;background:#344434;color:white;margin:3px}
.card{background:#1c261e;padding:15px;border-radius:13px;margin:12px 0}
.item{padding:12px 0;border-bottom:1px solid #405040}
small,p{line-height:1.5;color:#c2cabe}
.hidden{display:none}summary{color:#b8f36b}
input{accent-color:#b8f36b}input[type=number],input[type=date]{padding:9px;max-width:95%}
progress{width:100%;accent-color:#b8f36b}
</style>
</head>
<body>
<header><h1>HomeFit 💪</h1><p>Your home workout tracker</p><small>Beginner • No gym needed</small></header>
<main>
<nav>
<button onclick="page('today')">Today</button>
<button onclick="page('week')">Weekly Plan</button>
<button onclick="page('steps')">Steps</button>
<button onclick="page('guide')">Exercise Guide</button>
</nav>
<section id="today" class="card">
<h2 id="heading"></h2>
<label>Date <input id="date" type="date"></label>
<p>Warm up for 5 minutes. Rest 60–120 seconds between sets.</p>
<div id="workout"></div><progress id="bar" value="0" max="100"></progress>
<p id="count"></p><button onclick="finish()">Finish Workout</button>
</section>
<section id="week" class="card hidden"><h2>Weekly Plan</h2><div id="schedule"></div></section>
<section id="steps" class="card hidden">
<h2>Daily Steps 👟</h2><label>Date <input id="sd" type="date"></label>
<label>Steps <input id="sv" type="number" min="0" placeholder="e.g. 7000"></label>
<button onclick="saveSteps()">Save Steps</button><p id="stepmsg"></p>
<progress id="stepbar" value="0" max="10000"></progress><h3>History</h3><div id="history"></div>
</section>
<section id="guide" class="card hidden"><h2>Exercise Guide</h2><div id="guides"></div></section>
<section class="card"><h3>Your Progress</h3><p id="summary"></p>
<button onclick="backup()">Export Backup</button>
<button onclick="resetData()">Reset Data</button></section>
</main>
<script>
const D=[
["Monday","Chest, Shoulders & Triceps",[
["Incline push-ups","3 × 8–12","Hands on a stable raised surface. Keep your body straight, lower your chest, then push up."],
["Regular push-ups","2 × 4–6","Keep your body aligned. Use knee or incline push-ups if needed."],
["Pike push-ups / wall slides","2 × 6–8 / 8–10","Raise hips for pike push-ups and lower your head gently. Wall slides are easier."],
["Shoulder taps","2 × 10","From a plank or knee plank, tap opposite shoulders without rocking."]
]],
["Tuesday","Cardio & Core",[
["Brisk walk or marching","15–20 min","Walk or march at a pace where you can still talk."],
["Dead bugs","2 × 10 total","On your back, slowly extend opposite arm and leg, then alternate."],
["Bird dogs","2 × 10 total","On hands and knees, extend opposite arm and leg with hips level."],
["Plank","2 × 15–25 sec","Keep your body straight and breathe. Knee plank is fine."]
]],
["Wednesday","Back & Biceps",[
["Backpack rows","3 × 10–15","Use a light, securely closed backpack. Hinge at hips and pull it toward your lower ribs."],
["Backpack curls","2 × 10–15","Curl a securely held bag without swinging."],
["Reverse snow angels","2 × 10","Move your arms in a comfortable arc while standing or lying face down."],
["Superman","2 × 8","Lie face down and gently lift arms and legs. Stop if uncomfortable."]
]],
["Thursday","Legs",[
["Squats","3 × 10–12","Sit hips back, bend knees comfortably and stand smoothly."],
["Reverse lunges","2 × 6–8 each leg","Step backward and bend knees comfortably. Use a wall for balance."],
["Glute bridges","2 × 12","Lie on your back, knees bent. Raise hips smoothly and lower."],
["Calf raises","2 × 15","Hold a wall, rise onto toes, then lower slowly."]
]],
["Friday","Full Body",[
["Squats","10–12 reps","Sit hips back and stand smoothly."],
["Push-ups","6–8 reps","Choose an incline or knee version if needed."],
["Backpack rows","12 reps","Pull the securely held bag toward your lower ribs."],
["Backpack curls","10 reps","Curl without swinging."],
["Marching","60 seconds","March comfortably in place."]
]],
["Saturday","Walking & Mobility",[
["Walk","20–30 min","Comfortable or brisk walking; shorter walks count."],
["Gentle stretching","5–10 min","Stretch gently; never force a stretch."]
]],
["Sunday","Rest & Recovery",[
["Rest or easy walk","As comfortable","Skip strength training and prioritize sleep, food and hydration."]
]]
];
const $=x=>document.getElementById(x);
let data={checks:{},done:[],steps:{}};
try{data={...data,...JSON.parse(localStorage.getItem("hfdata")||"{}") } }catch(e){}
function save(){localStorage.setItem("hfdata",JSON.stringify(data))}
function today(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function chosenDay(s){return D[(new Date(s+"T12:00:00").getDay()+6)%7]}
function page(id){document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden")}
function render(){
let s=$("date").value||today(),d=chosenDay(s),c=data.checks[s]||{};
$("heading").textContent=d[0]+" — "+d[1];
$("workout").innerHTML=d[2].map((x,i)=>`<div class="item"><b>${x[0]}</b><p>${x[1]}</p><label><input type="checkbox" data-i="${i}" ${c[i]?"checked":""}> Completed</label><details><summary>How to do it</summary><p>${x[2]}</p></details></div>`).join("");
$("workout").querySelectorAll("[data-i]").forEach(e=>e.onchange=()=>{data.checks[s]=data.checks[s]||{};data.checks[s][e.dataset.i]=e.checked;save();progress()});
$("sd").value=s;stepsLoad();progress();summary();
}
function progress(){let s=$("date").value||today(),d=chosenDay(s),c=data.checks[s]||{},n=d[2].filter((x,i)=>c[i]).length;$("bar").value=100*n/d[2].length;$("count").textContent=n+" of "+d[2].length+" exercises completed"}
function finish(){let s=$("date").value||today();if(!data.done.includes(s))data.done.push(s);save();summary();alert("Workout saved!")}
function renderWeek(){$("schedule").innerHTML=D.map(d=>`<div class="item"><b>${d[0]} — ${d[1]}</b>${d[2].map(x=>`<p>${x[0]}: ${x[1]}</p>`).join("")}</div>`).join("")}
function renderGuide(){$("guides").innerHTML=D.flatMap(d=>d[2]).filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i).map(x=>`<details class="item"><summary>${x[0]} — ${x[1]}</summary><p>${x[2]}</p></details>`).join("")}
function saveSteps(){let s=$("sd").value||today();data.steps[s]=Math.max(0,Number($("sv").value)||0);save();stepsLoad();summary()}
function stepsLoad(){let s=$("sd").value||today(),n=Number(data.steps[s])||0;$("sv").value=data.steps[s]??"";$("stepbar").value=Math.min(n,10000);$("stepmsg").textContent=n.toLocaleString()+" / 10,000 steps";$("history").innerHTML=Object.entries(data.steps).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14).map(([d,v])=>`<p>${d}: ${Number(v).toLocaleString()} steps</p>`).join("")||"No steps recorded yet."}
function summary(){$("summary").textContent=data.done.length+" workout days completed • "+Object.keys(data.steps).length+" days of steps recorded."}
function backup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download="homefit-backup.json";a.click();URL.revokeObjectURL(u)}
function resetData(){if(confirm("Delete all saved progress?")){data={checks:{},done:[],steps:{}};save();render()}}
$("date").value=today();$("sd").value=today();$("date").onchange=render;$("sd").onchange=stepsLoad;
render();renderWeek();renderGuide();summary();
</script>
</body>
</html>
